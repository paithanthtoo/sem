name: A workflow for my Hello World App
on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/**'

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Docker Network and MongoDB
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo:latest
          docker run -d --name mongo-dbserver --network se-methods mongo:latest

      - name: Build with Maven
        run: mvn package

      - name: Build Docker Image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: View logs
        run: docker logs devopscontainer